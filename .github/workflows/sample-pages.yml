name: Publish sample findings
on:
  workflow_dispatch:
  # stage is the default branch and the only branch allowed by the github-pages environment.
  push:
    branches: [stage]
    paths:
      - docs/samples/**
      - .github/workflows/sample-pages.yml
permissions:
  contents: read
concurrency:
  group: sample-pages
  cancel-in-progress: false
# The Pages source must stay "GitHub Actions". A branch source also builds the whole repository
# with Jekyll and publishes it over the samples.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/samples
  # A separate job: deploying right after the upload in one job intermittently found no artifact
  # (actions/deploy-pages#451).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy samples
        id: deployment
        uses: actions/deploy-pages@v5
